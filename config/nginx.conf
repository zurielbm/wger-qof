# nginx for the Dokploy compose stack.
#
# Dokploy's Traefik terminates TLS and routes the public domain to this
# container on port 80. nginx serves the static and media volumes directly
# (gunicorn does not serve files in production) and proxies everything else
# to the Django container.

upstream wger {
    server web:8000;
}

server {
    listen 80;

    location /static/ {
        alias /wger/static/;
    }

    location /media/ {
        alias /wger/media/;
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Exercise video uploads
    client_max_body_size 100M;
}
