# Compose stack for deploying this fork on Dokploy.
#
# Dokploy setup:
#   - Create Service -> Compose -> point at this repo, compose path ./docker-compose.dokploy.yml
#   - Domains tab: route your domain to service "web", container port 3009
#   - Environment tab: set the variables referenced below (${...}). Dokploy writes
#     them to a .env file used for interpolation here; secrets never live in git.
#
# Non-secret defaults live in ./config/prod.env.

# Web, celery worker and beat all run the same image; only "web" builds it.
x-wger-env: &wger-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Dokploy Environment tab}
  SITE_URL: ${SITE_URL:-http://localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
  # Generate once with: docker compose exec web python3 manage.py generate-jwt-keys
  # Without them, mobile-app tokens are invalidated on every restart.
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
  DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-wger}
  TIME_ZONE: ${TIME_ZONE:-UTC}
  TZ: ${TIME_ZONE:-UTC}
  # PowerSync (mobile app offline sync). The entrypoint creates this storage
  # role/schema in postgres on boot; the app is told to reach the sync service
  # at POWERSYNC_URL (set it to the public domain routed to the powersync
  # service, e.g. https://sync.example.com).
  PS_STORAGE_PG_URI: postgres://powersync_storage:${POWERSYNC_STORAGE_PASSWORD:-powersync_password}@db:5432/wger
  POWERSYNC_URL: ${POWERSYNC_URL:-}

services:
  web:
    image: wger-qof:latest
    build:
      context: .
      dockerfile: extras/docker/production/Dockerfile
    env_file: ./config/prod.env
    environment: *wger-env
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    expose:
      - "3009"
    # web sits on both networks: "wger" to reach db/cache, "dokploy-network" so
    # Traefik can route the domain to it. Listing dokploy-network explicitly
    # keeps Dokploy's own network injection from replacing the private network
    # (https://github.com/Dokploy/dokploy/issues/3562).
    networks:
      - wger
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3009" ]
      interval: 10s
      timeout: 5s
      # First boot loads fixtures and collects static files, which takes a while
      start_period: 300s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wger}
      POSTGRES_DB: wger
      TZ: ${TIME_ZONE:-UTC}
    networks:
      - wger
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # wal_level=logical is required by PowerSync's replication
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=768MB",
      "-c", "work_mem=8MB",
      "-c", "random_page_cost=1.1",
      "-c", "max_connections=50"
    ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "wger" ]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    networks:
      - wger
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  powersync:
    image: journeyapps/powersync-service:latest
    command: [ "start", "-r", "unified" ]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_PORT: "8080"
      # Replicates the wger database and reads the JWT verification keys from
      # the web container
      PS_DATABASE_URI: postgres://wger:${POSTGRES_PASSWORD:-wger}@db:5432/wger
      PS_STORAGE_PG_URI: postgres://powersync_storage:${POWERSYNC_STORAGE_PASSWORD:-powersync_password}@db:5432/wger
      PS_JWKS_URL: http://web:3009/api/v2/powersync-keys
    volumes:
      - ./config/powersync:/config:ro
    # Published on host port 3010 (container listens on 8080)
    ports:
      - "3010:8080"
    # On both networks like web: "wger" to reach db, "dokploy-network" so
    # Traefik can route the public sync domain to it
    networks:
      - wger
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    image: wger-qof:latest
    command: /start-worker
    env_file: ./config/prod.env
    environment: *wger-env
    networks:
      - wger
    volumes:
      - media:/home/wger/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "celery", "-A", "wger", "inspect", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery_beat:
    image: wger-qof:latest
    command: /start-beat
    env_file: ./config/prod.env
    environment: *wger-env
    networks:
      - wger
    volumes:
      - celery-beat:/home/wger/beat
    depends_on:
      celery_worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  celery-beat:
  static:
  media:

networks:
  wger:
  dokploy-network:
    external: true
